name: DevForge CI
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - run: go mod download
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...

  release-build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Build Windows binaries
        shell: bash
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME}"
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w -X devforge/cmd.version=${VERSION}" -o dist/devforge-windows-amd64.exe .
          GOOS=windows GOARCH=arm64 go build -trimpath -ldflags="-s -w -X devforge/cmd.version=${VERSION}" -o dist/devforge-windows-arm64.exe .
          cd dist
          sha256sum *.exe > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/devforge-windows-amd64.exe
            dist/devforge-windows-arm64.exe
            dist/SHA256SUMS.txt
